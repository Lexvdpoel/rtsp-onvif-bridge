services:
  controller:
    build:
      context: .
    image: ${BRIDGE_IMAGE:-rtsp-onvif-bridge:latest}
    container_name: onvif-bridge-controller
    restart: unless-stopped
    environment:
      ROLE: controller
      WEB_PORT: 8080
      BRIDGE_IMAGE: ${BRIDGE_IMAGE:-rtsp-onvif-bridge:latest}
      # macvlan network the virtual cameras are attached to.
      MACVLAN_NETWORK: ${MACVLAN_NETWORK:-camlan}
      MACVLAN_PARENT: ${MACVLAN_PARENT:-eth0}
      # Addressing for the macvlan network. The default is a parking subnet
      # that does not exist on your LAN; the cameras replace it over DHCP.
      MACVLAN_SUBNET: ${MACVLAN_SUBNET:-100.127.255.0/24}
      MACVLAN_GATEWAY: ${MACVLAN_GATEWAY:-}
      MACVLAN_IP_RANGE: ${MACVLAN_IP_RANGE:-}
      STATE_DIR: /state
      # Point at a host path instead if Unraid cannot fetch the URL.
      UNRAID_ICON: ${UNRAID_ICON:-}
      DATA_DIR: /data
    ports:
      - "${WEB_PORT:-8080}:8080"
    labels:
      # Unraid's Docker tab picks these up and shows an icon plus a WebUI link.
      net.unraid.docker.icon: "${UNRAID_ICON:-https://raw.githubusercontent.com/Lexvdpoel/rtsp-onvif-bridge/main/unraid/icon.png}"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./state:/state
      # Unraid only: lets the controller give each camera container an icon by
      # writing a dockerMan template for it. Harmless to leave out elsewhere.
      # - /boot/config/plugins/dockerMan/templates-user:/unraid-templates
